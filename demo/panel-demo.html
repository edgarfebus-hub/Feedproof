function serverTime(r) {
try {
var d = Date.parse(r.headers.get("date") || "");
if (d > 0) return d;
var x = Date.parse(r.headers.get("expires") || "");
if (x > 0) return x - 300000;
} catch (e) {}

function selfCheck(attempt) {

if (H.jsx) setStatus("Feedproof v" + VERSION + " · " + H.name + " · ready", "ok");
return;
}
if (!CEP || !H.jsx) return;
runJob({ action: "ping" }).then(function (res) {
var p = String(res).split("|");
if (p[0] === "OK" && p[1] === VERSION) {
setStatus("Feedproof v" + VERSION + " · " + H.name + " · ready", "ok");
return;
}
if (p[0] === "ERR" && (p[1] === "collision" || p[1] === "dispatch")) {
setStatus("Script self-test failed (" + p[2] + "). Send Claude a screenshot.", "err");
lockButtons();
return;
}
if (p[0] === "OK") {
setStatus("The panel is v" + VERSION + " but " + H.name + " is running v" + p[1] +
" of its script. Quit " + H.name + " completely (⌘Q), reopen it, then open this panel again.", "err");
lockButtons();
return;
}
if (attempt < 15) {
if (attempt === 2) setStatus("Waiting for " + H.name + " to finish loading…", "");
setTimeout(function () { selfCheck(attempt + 1); }, 2000);
} else {
setStatus(H.name + " isn't answering the panel. Close and reopen the panel; if it persists, restart " + H.name + ".", "err");
}
});
}
